<!doctype html><html><head><meta charset="utf-8"><meta name="theme-color" content="#1a1a1c"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest">

<title>Multitrack Studio</title>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-style studio. Header, fixed-playhead timeline over 10 track lanes, toolbar, import/record bar. */
:root {
  --bg: #000;
  --bar: #1a1a1c;
  --panel: #1c1c1f;
  --btn: #303034;
  --fg: #f4f4f5;
  --dim: #85858c;
  --line: #2c2c30;
  --rec: #ff3d3d;
  --font: Inter, "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto; background: var(--bg); }

.top {
  display: flex; align-items: center; gap: 2px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bar);
}
.top { position: relative; }
.top h1 { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .01em; pointer-events: none; }
#bUndo { margin-left: auto; }
.ib { appearance: none; border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #fff; }
.ib svg { width: 26px; height: 26px; }
.ib.off { color: #5d5d63; }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
.badge {
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%); z-index: 3; pointer-events: none;
  background: #ff4747; color: #fff; font-weight: 600; font-size: 15px; line-height: 1;
  padding: 7px 9px; border-radius: 7px; font-variant-numeric: tabular-nums;
}
.lwrap { position: absolute; left: 0; right: 0; top: var(--ruler, 62px); bottom: 0; z-index: 2; overflow: hidden; pointer-events: none; }
.labels {
  position: absolute; left: 0; top: 0; width: 28%; pointer-events: none;
  display: grid; grid-auto-rows: var(--row, 40px);
  padding-left: 12px; will-change: transform;
}
.lrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lrow > svg { width: 18px; height: 18px; flex: none; color: #fff; }
.chip {
  pointer-events: auto; appearance: none; flex: 1; min-width: 0; height: min(30px, calc(var(--row, 40px) - 10px));
  background: #2b2b2e; border: 1px solid transparent; border-radius: 6px; color: #fff;
  font-size: 12.5px; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.chip.sel { border-color: #9a9aa2; }
.chip.muted { color: var(--dim); text-decoration: line-through; }
.toast {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 32px);
  background: #3a3a3f; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.35; text-align: center; pointer-events: none;
}

.panel {
  background: var(--panel);
  padding-block: 8px 12px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
.grp { display: flex; align-items: flex-start; gap: 2px; }
.grp.mid { gap: 10px; }
.row2 { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); margin-top: 4px; }
.row2 .tb { font-size: 9.5px; padding: 4px 1px; }
.row2 .tb svg { width: 22px; height: 22px; }
@media (min-width: 520px) { .row2 .tb { font-size: 11px; } }
.tb {
  appearance: none; border: 0; background: none; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px;
  padding: 4px 2px; min-width: 0; text-align: center; border-radius: 10px;
  font-size: 10.5px; line-height: 1.15; font-weight: 500;
}
.tb svg { width: 25px; height: 25px; flex: none; }
.tb.off { color: var(--dim); }
.tb:disabled { opacity: .35; cursor: not-allowed; }
.row1 .tb:not(.t) { min-width: 50px; }
.big-row { display: flex; gap: 12px; margin-top: 10px; }
.big {
  appearance: none; flex: 1; height: 66px; border: 0; border-radius: 14px; background: var(--btn); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 16px; font-weight: 600;
}
.big svg { width: 28px; height: 28px; }
.big.rec { background: var(--rec); }
.vh { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
label.big, label.tb { cursor: pointer; }
label.btn { display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
.selbar { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; }
.pill { appearance: none; border: 0; height: 32px; padding: 0 9px; border-radius: 16px; background: var(--btn); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill[aria-pressed="true"] { background: #fff; color: #000; }
.pill.off { color: var(--dim); }
.selcount { margin-left: auto; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; max-height: 84%; overflow: auto; background: #212125; border-radius: 18px 18px 0 0;
  display: flex; flex-direction: column; gap: 14px;
  padding-top: 16px;
  padding-bottom: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sl { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.sl-h { display: flex; justify-content: space-between; color: #d4d4d8; }
.sl output { font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
input[type=range] { width: 100%; accent-color: #fff; height: 28px; margin: 0; }
.note { margin: 0; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 10px; }
.btn { appearance: none; flex: 1; height: 46px; border: 0; border-radius: 12px; background: var(--btn); color: #fff; font-size: 15px; font-weight: 600; }
.btn.pri { background: #fff; color: #000; }
.btn.warn { color: #ff7b7b; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.mini { display: flex; gap: 8px; }
.mini .btn { height: 38px; font-size: 13px; font-weight: 500; }
.trk { display: grid; grid-template-columns: 12px minmax(0, 1fr) 36px 36px; gap: 8px; align-items: center; padding-block: 6px; border-bottom: 1px solid var(--line); }
.trk .dot { width: 12px; height: 12px; border-radius: 50%; }
.trk input[type=text] { min-width: 0; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #2a2a2e; color: #fff; padding: 0 8px; font: inherit; font-size: 14px; -webkit-user-select: text; user-select: text; }
.trk input[type=range] { grid-column: 2 / 5; height: 22px; }
.tgl { appearance: none; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #2a2a2e; color: #cfcfd4; font-size: 13px; font-weight: 700; }
.tgl[aria-pressed="true"].m { background: #ff5d5d; color: #000; border-color: transparent; }
.tgl[aria-pressed="true"].s { background: #ffd23f; color: #000; border-color: transparent; }

.busy { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .6); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; font-size: 15px; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #555; border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sheet select, .sheet textarea, .sheet input[type=text] { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #2a2a2e; color: #fff; font: inherit; font-size: 15px; padding: 10px; -webkit-user-select: text; user-select: text; }
.sheet select { height: 44px; }
.sheet textarea { min-height: 38vh; resize: vertical; line-height: 1.6; }
.lyview { background: #141416; border: 1px solid var(--line); border-radius: 12px; padding: 14px; white-space: pre-wrap; overflow: auto; max-height: 36vh; line-height: 1.7; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.lyview.empty { color: var(--dim); font-size: 14px; }
.chk { display: flex; gap: 10px; align-items: center; font-size: 14px; color: #d4d4d8; }
.chk input { width: 20px; height: 20px; accent-color: #fff; flex: none; }
.btn.rec { background: var(--rec); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.mixer { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 6px; -webkit-overflow-scrolling: touch; }
.strip { flex: none; width: 68px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #2a2a2e; border-radius: 14px; padding: 10px 6px; }
.strip input[type=text] { width: 100%; height: 30px; padding: 0 4px; text-align: center; font-size: 12px; border-radius: 8px; border: 1px solid var(--line); background: #1c1c1f; }
.strip .tgl { width: 100%; height: 34px; }
.fader { position: relative; flex: none; width: 40px; height: 170px; border-radius: 20px; background: #17171a; touch-action: none; cursor: ns-resize; overflow: hidden; }
.fader .fill { position: absolute; left: 0; right: 0; bottom: 0; }
.fader .mark { position: absolute; left: 0; right: 0; height: 2px; background: rgba(255, 255, 255, .55); }
.strip.dim .fader { opacity: .45; }
.pct { appearance: none; border: 0; background: none; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; padding: 4px; min-height: 28px; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
@media (min-width: 520px) {
  .tb { font-size: 11.5px; }
  .tb svg { width: 28px; height: 28px; }
}

.recview { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; gap: 8px; max-width: 640px; margin: 0 auto;
  padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.recview .rhead { display: flex; align-items: center; gap: 8px; }
.recview .rhead h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recview .rhead .ib.hid { visibility: hidden; }
.recview .lyrow { display: flex; gap: 6px; }
.recview .lyrow select { flex: 1; min-width: 0; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #2a2a2e; color: #fff; font: inherit; font-size: 14px; padding: 0 8px; }
.recview .lyview { flex: 1; min-height: 70px; max-height: none; overflow-y: auto; padding: 14px 14px 0; scroll-behavior: auto; }
.recview .lytxt { padding-bottom: 60vh; }
.recview .btn { height: 42px; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; min-width: 0; }
.recview .btn svg { width: 18px; height: 18px; flex: none; }
.recview .sm .btn, .recview .lyrow .btn { height: 36px; font-size: 12.5px; font-weight: 500; flex: none; padding: 0 10px; }
.recview .sm { display: flex; gap: 6px; align-items: center; }
.recview .sm .grow { flex: 1; font-weight: 600; }
.recview .sm .lbl { min-width: 62px; text-align: center; font-size: 12px; color: #d4d4d8; font-variant-numeric: tabular-nums; }
.recview .lane { display: block; width: 100%; height: 96px; border-radius: 12px; touch-action: none; }
.recview .crow { display: flex; gap: 8px; }
.recview .crow .btn { flex: 1; }
.recview .btn.rec { background: var(--rec); color: #fff; }
.recview .btn.pause { background: #ffd23f; color: #000; }
.recview .btn.warn { color: #ff7b7b; }
.recview .note { font-size: 12.5px; }

/* mixer (Edit Tracks) */
.mx-head { display: flex; align-items: center; justify-content: space-between; margin: -4px 0 -4px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.mx-all { appearance: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: #c9c9cf; display: grid; place-items: center; }
.mx-all svg { width: 18px; height: 18px; }
.mx-all.on { background: #fff; color: #000; border-color: #fff; }
.mixer { gap: 8px; padding: 4px 0 2px; scrollbar-width: none; }
.mixer::-webkit-scrollbar { display: none; }
.strip { width: 58px; gap: 8px; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 9px 5px 6px; transition: opacity .15s; }
.strip .mx-num { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #a9a9b0; font-variant-numeric: tabular-nums; }
.strip .mx-num i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.strip input[type=text] { height: 22px; padding: 0 2px; font-size: 11px; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; color: #e4e4e7; }
.strip input[type=text]:focus { border-bottom-color: #8a8a92; outline: 0; }
.mx-btns { display: flex; gap: 4px; }
.strip .tgl { width: 24px; height: 24px; border-radius: 7px; border: 0; background: #26262a; color: #9a9aa2; display: grid; place-items: center; padding: 0; }
.strip .tgl svg { width: 14px; height: 14px; }
.tgl[aria-pressed="true"].m { background: #ff5d5d; color: #1a0000; }
.tgl[aria-pressed="true"].s { background: #ffd23f; color: #1a1400; }
.fader { width: 26px; height: 138px; border-radius: 13px; background: #121214; box-shadow: inset 0 0 0 1px #26262a; }
.fader .fill { opacity: .9; border-radius: 0 0 13px 13px; }
.fader .mark { height: 1px; background: rgba(255, 255, 255, .7); }
.pct { font-size: 11px; color: #c9c9cf; padding: 2px; min-height: 22px; }
.mx-note { font-size: 11.5px; line-height: 1.4; }

/* record screen v2 */
.recview { gap: 10px; background: #0b0b0d; }
.recview .rhead h2 { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.recview .lyrow { align-items: center; }
.recview .lyrow select { height: 36px; border-radius: 18px; background: #1a1a1e; border: 1px solid var(--line); padding: 0 14px; font-size: 13.5px; color: #e4e4e7; }
.recview .sq { appearance: none; flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #1a1a1e; color: #e4e4e7; display: grid; place-items: center; padding: 0; }
.recview .sq svg { width: 17px; height: 17px; }
.recview .sq:disabled { opacity: .35; }
.recview .sq.arm { background: #ff5d5d; color: #1a0000; border-color: transparent; }
.recview .lyview { background: #111114; border: 1px solid #1f1f23; border-radius: 16px; line-height: 1.75; }
.recview .lyview.empty { display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
.recview .rtools { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.recview .sw { appearance: none; border: 0; background: none; color: #d4d4d8; display: flex; align-items: center; gap: 9px; font-size: 12.5px; text-align: left; padding: 2px 0; min-height: 32px; }
.recview .sw i { position: relative; flex: none; width: 34px; height: 20px; border-radius: 10px; background: #3a3a40; transition: background .15s; }
.recview .sw i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.recview .sw[aria-checked="true"] i { background: #34c759; }
.recview .sw[aria-checked="true"] i::after { transform: translateX(14px); }
.recview .rtools .sw { flex: 1; min-width: 0; white-space: nowrap; }
.recview .stp { display: flex; align-items: center; background: #1a1a1e; border: 1px solid var(--line); border-radius: 16px; height: 32px; flex: none; font-size: 12px; color: #c9c9cf; font-variant-numeric: tabular-nums; }
.recview .stp span { padding: 0 2px; min-width: 18px; text-align: center; white-space: nowrap; }
.recview .stp b { color: #fff; font-weight: 600; }
.recview .st { appearance: none; border: 0; background: none; color: #fff; width: 30px; height: 30px; font-size: 14px; font-weight: 600; padding: 0; }
.recview .lane { height: 88px; border-radius: 14px; }
.recview .rstat { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #a9a9b0; min-height: 18px; }
.recview .rstat i { width: 8px; height: 8px; border-radius: 50%; background: #5d5d63; }
.recview .rstat i.live { background: #ff3d3d; animation: blink 1s ease-in-out infinite; }
.recview .rstat i.hold { background: #ffd23f; }
.recview .rstat i.done { background: #34c759; }
@keyframes blink { 50% { opacity: .25; } }
.recview .ctl { display: flex; align-items: flex-end; justify-content: space-around; gap: 6px; padding: 2px 0 4px; }
.recview .cb { appearance: none; border: 0; background: none; color: #e4e4e7; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; min-width: 60px; }
.recview .cb .cc { display: grid; place-items: center; border-radius: 50%; background: #1f1f24; border: 1px solid #2c2c32; width: 50px; height: 50px; }
.recview .cb .cc svg { width: 22px; height: 22px; }
.recview .cb .cl { font-size: 11.5px; color: #a9a9b0; font-weight: 500; }
.recview .cb.main .cc { width: 78px; height: 78px; border: 0; }
.recview .cb.main .cc svg { width: 34px; height: 34px; }
.recview .cb.main .cl { color: #e4e4e7; font-size: 12.5px; }
.recview .cb.red .cc { background: var(--rec); color: #fff; box-shadow: 0 0 0 6px rgba(255, 61, 61, .16); }
.recview .cb.amber .cc { background: #ffd23f; color: #1a1400; box-shadow: 0 0 0 6px rgba(255, 210, 63, .14); }
.recview .cb.light .cc { background: #fff; color: #000; }
.recview .cb.ok .cc { background: #34c759; color: #04200b; border: 0; }
.recview .cb.arm .cc { background: #ff5d5d; color: #1a0000; border-color: transparent; }
.recview .cb.arm .cl { color: #ff8a8a; }
.recview .cb:active .cc { transform: scale(.94); }
.recview .hint { margin: 0; text-align: center; font-size: 11.5px; color: #6f6f77; white-space: pre-wrap; }
@media (prefers-reduced-motion: reduce) { .recview .rstat i.live { animation: none; } }

/* edge-to-edge header: the bar colour runs up under the phone's status bar */
:root { padding-top: 0; }
.top { padding-top: max(8px, env(safe-area-inset-top, 0px)); }
.top h1 { top: calc(50% + env(safe-area-inset-top, 0px) / 2); }
.panel { padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }

.pill.ic { width: 42px; padding: 0; display: grid; place-items: center; }
.pill.ic svg { width: 19px; height: 19px; }

/* bottom tool strip: swipe sideways, hold 2 s to rearrange (top row stays fixed) */
.row2 { position: relative; display: flex; grid-template-columns: none; overflow-x: auto; overflow-y: hidden; margin-top: 0; padding: 6px 0 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.row2::-webkit-scrollbar { display: none; }
.row2 .tb { flex: 0 0 17.5%; touch-action: pan-x; -webkit-touch-callout: none; }
.row2.sorting .tb:not(.lift) { opacity: .55; }
.row2 .tb.lift { position: relative; z-index: 3; opacity: 1; background: #303034; box-shadow: 0 8px 20px rgba(0, 0, 0, .55); }

/* ===== visual polish (layout unchanged) ===== */
:root { --bg: #06070a; --bar: #14151a; --panel: #15161b; --btn: #262830; --line: #272932; --dim: #8b8b94; }
.top { background: linear-gradient(180deg, #1b1c22, #121318); border-bottom: 1px solid rgba(255, 255, 255, .06); }

// WSOLA time stretch. rate > 1 = faster (shorter), rate < 1 = slower (longer). Pitch is kept.

function wsolaStretch(chans, rate) {

// Pitch shift by semitones, length kept: stretch by the pitch factor, then resample back.
function pitchShift(chans, semis) {
  if (Math.abs(semis) < 0.01) return chans.map((c) => Float32Array.from(c));
  const f = Math.pow(2, semis / 12);
  const st = wsolaStretch(chans, 1 / f);
  const outLen = Math.floor(st[0].length / f);

    const o = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {

      const i0 = Math.floor(p);

      const a = s[i0];
      const b = i0 + 1 < s.length ? s[i0 + 1] : a;
      o[i] = a + (b - a) * fr;
    }
    return o;
  });
}

// ---------- editing actions ----------
function settleClips(cs) {
  let res = 'ok';
  const sorted = cs.slice().sort((a, b) => a.start - b.start);
  for (const c of sorted) {
    if (overlaps(c.track, c.start, c.dur, c.id)) {
      const ft = freeTrack(c.start, c.dur, c.track, c.id);
      if (overlaps(ft, c.start, c.dur, c.id)) return 'fail';
      c.track = ft;
      res = 'moved';
    }
  }
  return res;
}
function revertClips(orig, popUndo) {
  orig.forEach((o) => { o.c.start = o.start; o.c.track = o.track; });
  if (popUndo) undoS.pop();
  changed();
}
function moveHere() {
  const cs = selClips();
  if (!cs.length) return;
  pushUndo();
  const delta = S.t - Math.min.apply(null, cs.map((c) => c.start));
  cs.forEach((c) => { c.start = Math.max(0, c.start + delta); });
  const ids = new Set(cs.map((c) => c.id));
  const into = cs.some((c) => overlaps(c.track, c.start, c.dur, c.id));
  S.clips = S.clips.filter((c) => !ids.has(c.id)).concat(cs);
  if (selClip()) S.tr = selClip().track;
  changed();
  if (into) toast('Clip now overlaps another clip');
}
function splitTarget() {
  const t = S.t;
  const ok = (x) => x && t > x.start + 0.02 && t < x.start + x.dur - 0.02;
  const c = selClip();
  return ok(c) ? c : null;
}
function doSplit() {
  const c = splitTarget();
  if (!c) { toast(HINT.split); return; }
  pushUndo();
  const d = S.t - c.start;
  const b = Object.assign({}, c, { id: nextId++, start: S.t, off: c.off + d, dur: c.dur - d, fi: 0 });
  c.dur = d;
  c.fo = 0;
  clampFades(c);
  clampFades(b);
  S.clips.push(b);
  S.sel = b.id;
  S.tr = b.track;
  refreshLabels();
  changed();
}
function doDelete() {
  const ids = new Set(selIds());
  pushUndo();
  S.clips = S.clips.filter((x) => !ids.has(x.id));
  S.sel = null;
  changed();
}
function doCopy() {
  S.cb = Object.assign({}, selClip());
  toast('Copied');

}
function fitOnTrack(ti, t, dur) {
  let prevEnd = 0;
  let nextStart = Infinity;
  for (const c of S.clips) {
    if (c.track !== ti) continue;
    const e = c.start + c.dur;
    if (e <= t + 1e-6) prevEnd = Math.max(prevEnd, e);
    else if (c.start >= t - 1e-6) nextStart = Math.min(nextStart, c.start);
    else return null;
  }
  if (nextStart - t >= dur - 1e-6) return t;
  if (nextStart - prevEnd >= dur - 1e-6) return nextStart - dur;
  return null;
}
function doPaste() {
  const src = S.cb;
  const sc = selClip();
  const target = sc ? sc.track : S.trPick ? S.tr : null;
  pushUndo();
  let tr;
  let st = S.t;
  const fit = target != null && target < usedCount() ? fitOnTrack(target, S.t, src.dur) : null;
  if (fit != null) {
    tr = target;
    st = fit;
  } else {
    tr = newTrackIndex(S.t, src.dur, S.tr);
    if (target != null && target < usedCount()) toast('No free space here, so the clip was placed on a new track');
  }
  const c = Object.assign({}, src, { id: nextId++, start: st, track: tr });
  S.clips.push(c);

const pick = $('#pick');

async function importFiles(files, mode) {
  await busy('Loading audio…', async () => {
    const got = [];
    let failed = 0;
    for (const f of files) {
      try {
        const ab = await f.arrayBuffer();
        got.push({ name: f.name, buf: await decode(ab) });
      } catch (e) { failed++; }
    }
    if (!got.length) { toast('Could not read this file. Try MP3, M4A or WAV.'); return; }
    const target = mode === 'replace' ? S.clips.find((c) => c.id === replaceId) : null;
    if (mode === 'replace' && !target) { toast('Clip to replace not found, select it again'); return; }
    pushUndo();
    if (target) {
      setClipBuf(target, got[0].buf);
      target.name = got[0].name;
      if (settleClips([target]) === 'moved') toast('Clip moved to another track to avoid overlap');
      else toast('Audio replaced');
    } else {
      if (got.length === 1) {
        placeBuf(got[0].buf, got[0].name, S.t, S.tr);
      } else {
        // several files: lay them one after another on the first track that has room
        const total = got.reduce((m, it) => m + it.buf.duration, 0);
        const tr = freeTrack(S.t, total, null);
        ensureTracks(tr + 1);
        let at = S.t;
        const ids = [];
        for (const it of got) {
          const c = { id: nextId++, track: tr, start: at, buf: it.buf, off: 0, dur: it.buf.duration, gain: 1, fi: 0, fo: 0, name: it.name };
          S.clips.push(c);
          ids.push(c.id);
          at += it.buf.duration;
        }
        setSel(ids);
        S.tr = tr;
        S.trPick = true;
        revealTrack(tr);
        toast(got.length + ' audios placed one after another on track ' + (tr + 1));
      }
    }
    refreshLabels();
    changed();
    if (failed) toast(failed + ' file(s) could not be read');
  });
}
function newTrackIndex(start, dur, prefer) {
  for (let i = 0; ; i++) if (!S.clips.some((c) => c.track === i)) return i;
}
function placeBuf(buf, name, start, prefer) {
  const tr = newTrackIndex(start, buf.duration, prefer);
  const c = { id: nextId++, track: tr, start, buf, off: 0, dur: buf.duration, gain: 1, fi: 0, fo: 0, name };
  S.clips.push(c);

}

// ----- lane (audio track under the lyrics) -----
function drawLane() {
  const cv = R.cv;
  if (!cv || !cv.isConnected) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#17171a';
  g.fillRect(0, 0, W, H);
  const mid = H / 2;
  g.fillStyle = '#2c2c30';
  g.fillRect(0, mid, W, 1);
  const step = 4;
  g.font = '600 12px Inter, system-ui, sans-serif';
  g.textBaseline = 'top';
  if (R.st === 'rec' || R.st === 'paused') {
    const n = R.peaks.length;
    const cap = Math.floor((W - 8) / step);
    g.fillStyle = R.st === 'rec' ? '#ff5d5d' : '#a05a5a';
    for (let i = Math.max(0, n - cap); i < n; i++) {
      const x = W - 8 - (n - i) * step;
      const a = Math.min(1, Math.sqrt(R.peaks[i]) * 1.2) * (H * 0.42);
      g.fillRect(x, mid - Math.max(1, a), 2.5, Math.max(2, a * 2));
    }
    g.fillStyle = '#fff';
    g.fillRect(W - 5, 0, 2, H);
    g.fillStyle = '#d4d4d8';
    g.textAlign = 'left';
    g.fillText('Audio track · ' + fmtT(rec ? elapsedOf(rec) : 0), 10, 6);
  } else if (R.st === 'review' && R.take) {
    const buf = R.take.buf, dur = buf.duration;
    const pk = peaksOf(buf);
    const cols = Math.max(1, Math.floor((W - 8) / step));
    const pos = R.playing && ctx ? clamp(ctx.currentTime - R.pStart, 0, dur) : R.pOff;
    const pc = pos / dur * cols;
    for (let i = 0; i < cols; i++) {
      const m = maxPeak(pk, i / cols * dur, (i + 1) / cols * dur);
      const a = Math.min(1, Math.sqrt(m) * 1.2) * (H * 0.42);
      g.fillStyle = i < pc ? '#ffffff' : '#6b6b73';
      g.fillRect(4 + i * step, mid - Math.max(1, a), 2.5, Math.max(2, a * 2));
    }
    g.fillStyle = tcol(S.tr);
    g.fillRect(4 + pc * step, 0, 2, H);
    g.fillStyle = '#d4d4d8';
    g.textAlign = 'left';
    g.fillText('Audio track · ' + fmtT(pos) + ' / ' + fmtT(dur), 10, 6);
  } else {
    g.fillStyle = '#85858c';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '13px Inter, system-ui, sans-serif';
    g.fillText('The audio track appears here while you record', W / 2, mid);
  }
}
function sampleLevel() {
  const r = rec;

  r.an.getFloatTimeDomainData(r.data);

  for (let i = 0; i < r.data.length; i++) { const v = r.data[i] < 0 ? -r.data[i] : r.data[i]; if (v > m) m = v; }
  r.lvl = Math.max(r.lvl || 0, m);
  const target = Math.floor(elapsedOf(r) * 20);

}
function recLoop(now) {
  R.raf = 0;

  const dt = Math.min(0.1, Math.max(0, (now - R.last) / 1000));
  R.last = now;
  if (R.st === 'rec') {
    sampleLevel();
    const box = $('#lyView');
    if (box && lyView.scroll && performance.now() > R.userUntil) {
      const mx = Math.max(0, box.scrollHeight - box.clientHeight);
      R.lyPos = Math.min(mx, R.lyPos + lyView.speed * 8 * dt);
      box.scrollTop = R.lyPos;

  }

}

function stopPlay(reset) {

    if (running) {
      running = false;
      if (wasPlaying && S.t < projectEnd() - 0.01) play(); else changed();
      setTimeout(() => { suppressClick = false; }, 60);
    }
  };
  btn.addEventListener('pointerdown', () => {
    clearTimeout(timer);
    timer = setTimeout(begin, 350);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.style.touchAction = 'none';
}
// ---------- bottom tool strip: scrolls sideways, hold a tool for 1.4 seconds to drag it to a new place ----------
const TOOL_KEY = 'mts_tools_v1';
function initToolDrag() {
  const row = $('#row2');
  const defaults = [...row.children].map((el) => el.dataset.k);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(TOOL_KEY) || 'null'); } catch (e) { saved = null; }
  if (Array.isArray(saved)) {
    const by = {};
    [...row.children].forEach((el) => { by[el.dataset.k] = el; });
    saved.filter((k) => by[k]).concat(defaults.filter((k) => !saved.includes(k))).forEach((k) => row.append(by[k]));
  }
  const save = () => { try { localStorage.setItem(TOOL_KEY, JSON.stringify([...row.children].map((el) => el.dataset.k))); } catch (e) { /* ignore */ } };
  let st = null;
  let swallow = false;
  let raf = 0;
  const place = () => {
    if (!st || !st.on) return;
    const el = st.el;
    const sibs = [...row.children].filter((k) => k !== el);
    let idx = 0;
    for (const k of sibs) {
      const r = k.getBoundingClientRect();
      if (r.left + r.width / 2 < st.px) idx++;
    }
    if ([...row.children].indexOf(el) !== idx) row.insertBefore(el, sibs[idx] || null);
    const rr = row.getBoundingClientRect();
    const center = rr.left - row.scrollLeft + el.offsetLeft + el.offsetWidth / 2;
    el.style.transform = 'translateX(' + (st.px - center) + 'px) scale(1.08)';
  };
  const loop = () => {
    if (!st || !st.on) return;
    const rr = row.getBoundingClientRect();
    if (st.px < rr.left + 40) row.scrollLeft -= 9;
    else if (st.px > rr.right - 40) row.scrollLeft += 9;
    place();
    raf = requestAnimationFrame(loop);
  };
  const end = () => {
    if (!st) return;
    clearTimeout(st.timer);
    cancelAnimationFrame(raf);
    if (st.on) {
      st.el.classList.remove('lift');
      st.el.style.transform = '';
      row.classList.remove('sorting');
      save();
      swallow = true;
      setTimeout(() => { swallow = false; }, 450);
    }
    st = null;
  };
  row.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.tb');
    if (!el || !row.contains(el) || st) return;
    const cur = { el, id: e.pointerId, x0: e.clientX, y0: e.clientY, px: e.clientX, on: false, timer: 0 };
    cur.timer = setTimeout(() => {
      if (st !== cur) return;
      cur.on = true;
      el.classList.add('lift');
      row.classList.add('sorting');
      try { el.setPointerCapture(cur.id); } catch (x) { /* ignore */ }
      try { if (navigator.vibrate) navigator.vibrate(25); } catch (x) { /* ignore */ }
      toast('Drag left or right to move this tool', 1800);
      place();
      raf = requestAnimationFrame(loop);
    }, 1400);
    st = cur;
  });
  row.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.id) return;
    if (!st.on) {
      if (Math.abs(e.clientX - st.x0) > 10 || Math.abs(e.clientY - st.y0) > 10) { clearTimeout(st.timer); st = null; }
      return;
    }
    st.px = e.clientX;
    place();
  });
  row.addEventListener('pointerup', end);
  row.addEventListener('pointercancel', end);
  row.addEventListener('lostpointercapture', end);
  row.addEventListener('contextmenu', (e) => e.preventDefault());
  row.addEventListener('click', (e) => {
    if (swallow) { e.stopPropagation(); e.preventDefault(); swallow = false; }
  }, true);
  document.addEventListener('touchmove', (e) => { if (st && st.on && e.cancelable) e.preventDefault(); }, { passive: false });
}
function buildPanel() {
  $('#row1').append(

  $('#bNone').addEventListener('click', () => {
    if (!selIds().length) { toast('No audio selected'); return; }
    S.sel = null;
    S.trPick = false;
    changed();
  });
  $('#bBack').innerHTML = ico('back');
  $('#bUndo').innerHTML = ico('undo');
  $('#bRedo').innerHTML = ico('redo');
  $('#bSave').innerHTML = ico('save');
  $('#bMulti').innerHTML = ico('multisel');
  $('#bAll').innerHTML = ico('selall');
  $('#bNone').innerHTML = ico('desel');
  $('#bUndo').addEventListener('click', undo);
  $('#bRedo').addEventListener('click', redo);
  $('#bSave').addEventListener('click', exportMix);
  // full screen: status bar stays hidden; swipe down from the top edge to peek at notifications
  const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const fsReq = () => {
    const el = document.documentElement;
    const f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!f) return;
    try { const r = f.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignore */ }
  };
  const inApp = () => ['fullscreen', 'standalone'].some((m) => window.matchMedia('(display-mode: ' + m + ')').matches);
  document.addEventListener('pointerdown', () => { if (!inApp() && !fsOn()) fsReq(); }, { passive: true });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  $('#bBack').addEventListener('click', () => {
    const stack = h('div', { class: 'stack' },
      h('button', { class: 'btn warn', type: 'button', onclick: () => {
        closeSheet();
        pushUndo();
        S.clips = [];
        S.sel = null;
        S.t = 0;
        changed();
        toast('All tracks cleared. Undo brings them back.');
      } }, 'Clear all tracks'),
      h('button', { class: 'btn', type: 'button', onclick: () => {
        closeSheet();
        pushUndo();
        loadDemo();
        changed();
      } }, 'Add demo audio'));
    openSheet('Studio', stack, null);
  });
}

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || !$('#scrim').hidden) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selClip()) { e.preventDefault(); doDelete(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
});

// ---------- autosave (IndexedDB) ----------
let dbP = null;
function openDB() {
  if (!dbP) {
    dbP = new Promise((res, rej) => {
      const rq = indexedDB.open('mtstudio', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('meta'); rq.result.createObjectStore('bufs'); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  return dbP;
}
const rqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = (tx) => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
const bufIds = new WeakMap();
const savedIds = new Set();
let bufSeq = 1, saveTimer = 0, saving = false, restoring = false;
function scheduleSave() {
  if (restoring) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProject, 900);
}
async function saveProject() {
  if (restoring) return;
  if (saving) { scheduleSave(); return; }
  saving = true;
  try {
    const db = await openDB();
    const used = new Set();
    const clips = S.clips.map((c) => {
      let id = bufIds.get(c.buf);
      if (!id) { id = 'b' + Date.now().toString(36) + (bufSeq++); bufIds.set(c.buf, id); }
      used.add(id);
      const o = {};
      for (const k in c) if (k !== 'buf') o[k] = c[k];
      o.bufId = id;
      return o;
    });
    const fresh = [];
    for (const c of S.clips) {
      const id = bufIds.get(c.buf);
      if (!savedIds.has(id) && !fresh.some((n) => n.id === id)) fresh.push({ id, buf: c.buf });
    }
    if (fresh.length) {
      const tx = db.transaction('bufs', 'readwrite');
      const st = tx.objectStore('bufs');
      for (const n of fresh) {
        const chans = [];
        for (let i = 0; i < n.buf.numberOfChannels; i++) chans.push(n.buf.getChannelData(i).slice());
        st.put({ sr: n.buf.sampleRate, chans }, n.id);
      }
      await txDone(tx);
      fresh.forEach((n) => savedIds.add(n.id));
    }
    const tx2 = db.transaction(['meta', 'bufs'], 'readwrite');
    tx2.objectStore('meta').put({ v: 1, clips, tracks: S.tracks, nextId, pps: S.pps }, 'project');
    const keys = await rqP(tx2.objectStore('bufs').getAllKeys());
    for (const k of keys) if (!used.has(k)) { tx2.objectStore('bufs').delete(k); savedIds.delete(k); }
    await txDone(tx2);
  } catch (e) {
    /* storage unavailable */
  } finally {
    saving = false;
  }
}
async function restoreProject() {
  restoring = true;
  let ok = false;
  try {
    const db = await openDB();
    const meta = await rqP(db.transaction('meta').objectStore('meta').get('project'));
    if (!meta || !meta.clips || !meta.clips.length || S.clips.length) return;
    const cache = new Map();
    const clips = [];
    for (const c of meta.clips) {
      let buf = cache.get(c.bufId);
      if (!buf) {
        const rec = await rqP(db.transaction('bufs').objectStore('bufs').get(c.bufId));
        if (!rec) continue;
        buf = makeBuf(rec.chans, rec.sr);
        cache.set(c.bufId, buf);
        bufIds.set(buf, c.bufId);
        savedIds.add(c.bufId);
      }
      const o = Object.assign({}, c, { buf });
      delete o.bufId;
      clips.push(o);
    }
    if (!clips.length || S.clips.length) return;
    S.clips = clips;
    if (Array.isArray(meta.tracks) && meta.tracks.length) S.tracks = meta.tracks;
    nextId = Math.max(nextId, meta.nextId || 1);
    if (meta.pps > 0) S.pps = meta.pps;
    S.t = 0;
    ok = true;
  } catch (e) {
    /* nothing saved */
  } finally {
    if (ok) { changed(); toast('Previous project restored'); }
    restoring = false;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(saveTimer); saveProject(); }
});
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); saveProject(); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }

// ---------- start ----------

buildPanel();
new ResizeObserver(resize).observe(stage);
resize();
updateUI();
loadLyrics();
restoreProject();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(requestDraw);
})();
