<style>
/* Layout: phone-style studio. Header, fixed-playhead timeline over 10 track lanes, toolbar, import/record bar. */
:root {
  --bg: #000;
  --bar: #1a1a1c;
  --panel: #1c1c1f;
  --btn: #303034;
  --fg: #f4f4f5;
  --dim: #85858c;
  --line: #2c2c30;

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);

  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto; background: var(--bg); }

.top {
  display: flex; align-items: center; gap: 2px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bar);
}
.top { position: relative; }
.top h1 { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .01em; pointer-events: none; }
#bUndo { margin-left: auto; }
.ib { appearance: none; border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #fff; }
.ib svg { width: 26px; height: 26px; }
.ib.off { color: #5d5d63; }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
.badge {
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%); z-index: 3; pointer-events: none;
  background: #ff4747; color: #fff; font-weight: 600; font-size: 15px; line-height: 1;
  padding: 7px 9px; border-radius: 7px; font-variant-numeric: tabular-nums;
}
.lwrap { position: absolute; left: 0; right: 0; top: var(--ruler, 62px); bottom: 0; z-index: 2; overflow: hidden; pointer-events: none; }
.labels {
  position: absolute; left: 0; top: 0; width: 28%; pointer-events: none;
  display: grid; grid-auto-rows: var(--row, 40px);
  padding-left: 12px; will-change: transform;
}
.lrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lrow > svg { width: 18px; height: 18px; flex: none; color: #fff; }
.chip {
  pointer-events: auto; appearance: none; flex: 1; min-width: 0; height: min(30px, calc(var(--row, 40px) - 10px));
  background: #2b2b2e; border: 1px solid transparent; border-radius: 6px; color: #fff;
  font-size: 12.5px; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.chip.sel { border-color: #9a9aa2; }
.chip.muted { color: var(--dim); text-decoration: line-through; }
.toast {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 32px);
  background: #3a3a3f; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.35; text-align: center; pointer-events: none;
}

.panel {
  background: var(--panel);
  padding-block: 8px 12px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
.grp { display: flex; align-items: flex-start; gap: 2px; }
.grp.mid { gap: 10px; }
.row2 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); margin-top: 4px; }
.tb {
  appearance: none; border: 0; background: none; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px;
  padding: 4px 2px; min-width: 0; text-align: center; border-radius: 10px;

.sl output { font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }

.note { margin: 0; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 10px; }
.btn { appearance: none; flex: 1; height: 46px; border: 0; border-radius: 12px; background: var(--btn); color: #fff; font-size: 15px; font-weight: 600; }
.btn.pri { background: #fff; color: #000; }
.btn.warn { color: #ff7b7b; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.mini { display: flex; gap: 8px; }
.mini .btn { height: 38px; font-size: 13px; font-weight: 500; }
.trk { display: grid; grid-template-columns: 12px minmax(0, 1fr) 36px 36px; gap: 8px; align-items: center; padding-block: 6px; border-bottom: 1px solid var(--line); }
.trk .dot { width: 12px; height: 12px; border-radius: 50%; }
.trk input[type=text] { min-width: 0; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #2a2a2e; color: #fff; padding: 0 8px; font: inherit; font-size: 14px; -webkit-user-select: text; user-select: text; }
.trk input[type=range] { grid-column: 2 / 5; height: 22px; }
.tgl { appearance: none; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #2a2a2e; color: #cfcfd4; font-size: 13px; font-weight: 700; }
.tgl[aria-pressed="true"].m { background: #ff5d5d; color: #000; border-color: transparent; }
.tgl[aria-pressed="true"].s { background: #ffd23f; color: #000; border-color: transparent; }

.busy { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .6); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; font-size: 15px; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #555; border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
@media (min-width: 520px) {
  .tb { font-size: 11.5px; }
  .tb svg { width: 28px; height: 28px; }
}

// WSOLA time stretch. rate > 1 = faster (shorter), rate < 1 = slower (longer). Pitch is kept.

function wsolaStretch(chans, rate) {

  }
  const hs = d.hist;
  if (hs.length >= 2) {
    const a = hs[0];
    const b = hs[hs.length - 1];

    if (dtm > 0 && performance.now() - b[0] < 80) {
      const v = ((b[1] - a[1]) / dtm) * 1000;

function clipAt(x, y) {

}

function settleClips(cs) {
  let res = 'ok';
  const sorted = cs.slice().sort((a, b) => a.start - b.start);
  for (const c of sorted) {
    if (overlaps(c.track, c.start, c.dur, c.id)) {
      const ft = freeTrack(c.start, c.dur, c.track, c.id);
      if (overlaps(ft, c.start, c.dur, c.id)) return 'fail';
      c.track = ft;
      res = 'moved';
    }
  }
  return res;
}
function revertClips(orig, popUndo) {
  orig.forEach((o) => { o.c.start = o.start; o.c.track = o.track; });
  if (popUndo) undoS.pop();
  changed();
}
function moveHere() {
  const cs = selClips();

  const orig = cs.map((c) => ({ c, start: c.start, track: c.track }));
  pushUndo();
  const delta = S.t - Math.min.apply(null, cs.map((c) => c.start));
  cs.forEach((c) => { c.start = Math.max(0, c.start + delta); });
  const res = settleClips(cs);
  if (res === 'fail') {
    revertClips(orig, true);
    toast('এখানে জায়গা নেই');
    return;
  }

  changed();
}
function splitTarget() {

}

  c.dur = d;

function fitOnTrack(ti, t, dur) {
  let prevEnd = 0;
  let nextStart = Infinity;
  for (const c of S.clips) {
    if (c.track !== ti) continue;
    const e = c.start + c.dur;
    if (e <= t + 1e-6) prevEnd = Math.max(prevEnd, e);
    else if (c.start >= t - 1e-6) nextStart = Math.min(nextStart, c.start);
    else return null;
  }
  if (nextStart - t >= dur - 1e-6) return t;
  if (nextStart - prevEnd >= dur - 1e-6) return nextStart - dur;
  return null;
}
function doPaste() {

async function importFiles(files, mode) {
  await busy('Loading audio…', async () => {
    const got = [];
    let failed = 0;
    for (const f of files) {
      try {
        const ab = await f.arrayBuffer();
        got.push({ name: f.name, buf: await decode(ab) });
      } catch (e) { failed++; }
    }
    if (!got.length) { toast('এই ফাইল পড়া যায়নি। MP3, M4A বা WAV দিয়ে চেষ্টা করুন।'); return; }
    const target = mode === 'replace' ? S.clips.find((c) => c.id === replaceId) : null;
    if (mode === 'replace' && !target) { toast('রিপ্লেস করার ক্লিপ পাওয়া যায়নি, আবার সিলেক্ট করুন'); return; }
    pushUndo();
    if (target) {
      setClipBuf(target, got[0].buf);
      target.name = got[0].name;
      if (settleClips([target]) === 'moved') toast('ওভারল্যাপ হওয়ায় ক্লিপ অন্য ট্র্যাকে সরানো হয়েছে');
      else toast('অডিও রিপ্লেস হয়েছে');
    } else {
      for (const it of got) placeBuf(it.buf, it.name, S.t, S.tr);

}

async function toggleRec() {

  let stream;

  mr.onstop = async () => {
    clearInterval(recTick);

    pause();

    const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
    await busy('Saving recording…', async () => {
      try {
        const buf = await decode(await blob.arrayBuffer());

function encodeWav(buf) {

  const sr = buf.sampleRate;
  const ba = nch * 2;
  const dataLen = len * ba;

let dlP = null;
function getDL() {
  if (!dlP) {
    dlP = (async () => {
      try { return window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { return null; }
    })();
  }
  return dlP;
}
async function exportMix() {
  if (!S.clips.length) { toast('আগে অডিও যোগ করুন'); return; }
  pause();
  const dl = await getDL();
  if (!dl) { toast('এই ভিউতে সেভ করা যাচ্ছে না'); return; }
  let blob = null;
  await busy('Mixing…', async () => {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const sr = 44100;
    const len = Math.ceil((projectEnd() + 0.05) * sr);
    const oc = new OAC(2, len, sr);
    scheduleAll(oc, oc.destination, 0, 0);
    const out = await oc.startRendering();
    blob = makeZip('studio-mix.wav', encodeWav(out));
  });
  try {
    await dl.save({ filename: 'studio-mix.zip', data: blob });
    toast('সেভ হয়েছে (zip এর ভেতরে WAV ফাইল)');
  } catch (e) {
    if (!e || e.code !== 'declined') toast('সেভ করা যায়নি');
  }
}

// ---------- toolbar ----------
const ACTIONS = [];
const playBtn = h('button', { class: 'tb t', type: 'button', 'aria-label': 'Play', onclick: togglePlay });
function act(k, label, need, fn, cls) {
  const a = { k, label, need, fn, el: null };
  const isRepl = k === 'repl';
  const b = h(isRepl ? 'label' : 'button', { class: 'tb ' + (cls || ''), type: isRepl ? null : 'button', for: isRepl ? 'pick' : null, 'aria-label': label || k, onclick: (ev) => {
    if (!enabled(a.need)) { if (isRepl) ev.preventDefault(); toast(HINT[a.need]); return; }
    a.fn();
  } });
  b.innerHTML = ico(k) + (label ? '<span>' + label + '</span>' : '');
  a.el = b;
  ACTIONS.push(a);
  return b;
}
function enabled(need) {
  if (!need) return true;
  if (need === 'clip') return !!selClip();
  if (need === 'paste') return !!S.cb;
  if (need === 'split') return !!splitTarget();
  return true;
}
let lastEn = '';
function updateEnabled() {
  const key = ACTIONS.map((a) => (enabled(a.need) ? 1 : 0)).join('');
  if (key === lastEn) return;
  lastEn = key;
  ACTIONS.forEach((a) => {
    const on = enabled(a.need);
    a.el.classList.toggle('off', !on);
    if (a.k === 'speed') {
      a.el.disabled = !on;
      a.el.setAttribute('aria-disabled', on ? 'false' : 'true');
    }
  });
}
let lastPlaying = null;
function updateSelBar() {
  const n = selIds().length;
  $('#bMulti').setAttribute('aria-pressed', S.multi ? 'true' : 'false');
  $('#bAll').classList.toggle('off', !S.clips.length || n >= S.clips.length);
  $('#bNone').classList.toggle('off', !n);
  $('#selCount').textContent = n ? n + ' selected' : '';
}
function updateUI() {
  updateEnabled();
  updateSelBar();
  if (lastPlaying !== S.playing) {
    lastPlaying = S.playing;
    playBtn.innerHTML = ico(S.playing ? 'pause' : 'play');
    playBtn.setAttribute('aria-label', S.playing ? 'Pause' : 'Play');
  }
  $('#bUndo').classList.toggle('off', !undoS.length);
  $('#bRedo').classList.toggle('off', !redoS.length);
}
function usedCount() {
  return new Set(S.clips.map((c) => c.track)).size;
}
function needsCompact() {
  const set = new Set(S.clips.map((c) => c.track));
  for (let i = 0; i < set.size; i++) if (!set.has(i)) return true;
  return false;
}
function compact() {
  const used = [...new Set(S.clips.map((c) => c.track))].sort((a, b) => a - b);
  const map = new Map();
  used.forEach((o, n) => map.set(o, n));
  const old = S.tracks;
  S.tracks = Array.from({ length: Math.max(NT, used.length) }, (c, ni) => {
    if (ni < used.length) {
      const t = Object.assign({}, old[used[ni]]);
      if (/^Track \d+$/.test(t.name)) t.name = 'Track ' + (ni + 1);
      return t;
    }
    return { name: 'Track ' + (ni + 1), vol: 1, mute: false, solo: false };
  });
  for (const c of S.clips) c.track = map.get(c.track);
  if (!map.has(S.tr)) S.trPick = false;
  S.tr = map.has(S.tr) ? map.get(S.tr) : Math.min(S.tr, Math.max(used.length - 1, 0));
}
function changed() {
  ensureTracks(S.clips.reduce((m, c) => Math.max(m, c.track), -1) + 1);
  if (S.extra.length) S.extra = S.extra.filter((id) => S.clips.some((c) => c.id === id));
  if (needsCompact()) compact();
  refreshLabels();
  updateUI();
  requestDraw();
}

let suppressClick = false;
function holdScrub(btn, dir) {
  let timer = 0;
  let running = false;
  let wasPlaying = false;
  let t0 = 0;
  let last = 0;
  const step = (now) => {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const speed = Math.min(1.5 + 2.2 * ((now - t0) / 1000), 12);
    S.t = clamp(S.t + dir * speed * dt, 0, projectEnd());
    requestDraw();
    if (S.t <= 0 || S.t >= projectEnd()) { stop(); return; }
    requestAnimationFrame(step);
  };
  const begin = () => {
    running = true;
    suppressClick = true;
    wasPlaying = S.playing;
    if (wasPlaying) pause();
    coast = 0;
    t0 = last = performance.now();
    requestAnimationFrame(step);
  };
  const stop = () => {
    clearTimeout(timer);
    if (running) {
      running = false;
      if (wasPlaying && S.t < projectEnd() - 0.01) play(); else changed();
      setTimeout(() => { suppressClick = false; }, 60);
    }
  };
  btn.addEventListener('pointerdown', () => {
    clearTimeout(timer);
    timer = setTimeout(begin, 350);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.style.touchAction = 'none';
}

}

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || !$('#scrim').hidden) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selClip()) { e.preventDefault(); doDelete(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
});
